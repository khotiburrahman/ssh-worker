name: Build ARM64

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-arm64:
    name: Build linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Tidy & Vet
        run: |
          go mod tidy
          go vet ./...

      - name: Tests (race)
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      - name: Build (arm64)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/gosshtunnel-linux-arm64 .

      - name: Checksum
        run: |
          cd dist
          sha256sum gosshtunnel-linux-arm64 > gosshtunnel-linux-arm64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: gosshtunnel-linux-arm64
          path: dist/*

      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*